apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.godotview'
version = '1.0.0'

android {
  namespace "expo.modules.godotview"
  compileSdkVersion 34

  def isReleaseTask = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
  def shouldPackageEmbeddedJniLibs = project
    .findProperty('RITMO_PACKAGE_EMBEDDED_JNILIBS')
    ?.toString()
    ?.toBoolean()
  if (shouldPackageEmbeddedJniLibs == null) {
    shouldPackageEmbeddedJniLibs = false
  }

  def shouldBundleGodotAssets = project
    .findProperty('RITMO_BUNDLE_GODOT_ASSETS')
    ?.toString()
    ?.toBoolean()
  if (shouldBundleGodotAssets == null) {
    shouldBundleGodotAssets = !isReleaseTask
  }

  defaultConfig {
    minSdkVersion 24
    targetSdkVersion 34
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  // Prevent compression of Godot asset files for sparse pack random access
  aaptOptions {
    noCompress 'sparsepck', 'pck', 'bin', 'cfg', 'ctex', 'mp3str',
               'gdc', 'tscn', 'import', 'tres', 'remap', 'res',
               'scn', 'gdshader', 'binary', 'translation'
  }

  androidResources {
    // Do not ignore any assets so .godot is packaged.
    ignoreAssetsPattern ''
  }

  if (!shouldBundleGodotAssets) {
    logger.lifecycle('[expo-godot-view] Skipping bundled Godot assets; payload will be downloaded at runtime.')
    sourceSets {
      main {
        assets.srcDirs = []
      }
    }
  }

  if (!shouldPackageEmbeddedJniLibs) {
    logger.lifecycle('[expo-godot-view] Skipping embedded JNI libs from src/main/jniLibs; relying on selected Godot AAR native libs.')
    sourceSets {
      main {
        jniLibs.srcDirs = []
      }
    }
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.0"
  implementation "androidx.fragment:fragment-ktx:1.8.2"
  
  // Godot library
  def requestedGodotAar = project.findProperty('RITMO_GODOT_AAR')
  def isReleaseBuild = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
  def defaultGodotAar = isReleaseBuild ? 'godot-lib.4.6.stable.template_release' : 'godot-lib.4.6.stable.template_debug'

  def candidates = []
  if (requestedGodotAar) {
    candidates << requestedGodotAar
  }
  candidates << defaultGodotAar
  candidates << 'godot-lib.4.6.stable.template_release'
  candidates << 'godot-lib.4.6.stable.template_debug'
  candidates << 'godot-lib.template_release'

  def selectedGodotAar = null
  def selectedGodotAarFile = null

  for (candidate in candidates.unique()) {
    def candidateFile = file("libs/${candidate}.aar")
    if (candidateFile.exists()) {
      selectedGodotAar = candidate
      selectedGodotAarFile = candidateFile
      break
    }
  }

  if (selectedGodotAarFile == null) {
    throw new GradleException("[expo-godot-view] Missing Godot AAR in android/libs. Tried: ${candidates.unique().collect { it + '.aar' }}")
  }

  logger.lifecycle("[expo-godot-view] Using ${selectedGodotAar}.aar")
  implementation(files(selectedGodotAarFile))
}
